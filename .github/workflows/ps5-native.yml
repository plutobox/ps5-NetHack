name: PS5 native title

# The native PS5 title (eboot.bin), as the PS5 homebrew catalog installs it.
# The ELF payload has its own workflow, ps5-release.yml.
#
# The catalog's versioning rules (docs/versioning.md in
# darkxex/ps5-homebrew-catalog): contentVersion in sce_sys/param.json is
# NN.NNN.NNN, rises with every release, and the release tag is that value.
# sys/ps5/content-version.py enforces them.
#
# - Every push to ps5: build <TITLE_ID>.zip and keep it as a CI artifact.
# - Run it by hand on ps5 with "release" set to patch, minor or major: raise
#   contentVersion, build from that, then commit the bump, tag it with the new
#   version and publish the release, in that order, so a failed build leaves
#   nothing behind. "current" releases the committed contentVersion as it is
#   (the first release, or after raising it by hand).
# - A tag pushed by hand, equal to contentVersion: publish its release.
#
# A release's only asset is the zip, as the catalog requires, and an existing
# release is never changed: a listed asset's sha256 must not change.
on:
  push:
    branches: [ps5]
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release, raising contentVersion by this part
        type: choice
        options: [none, patch, minor, major, current]
        default: none
      notes:
        description: Release notes (Markdown; short headings and bullet lists). Empty lists the commits since the last release.
        type: string
        default: ''

permissions:
  contents: write

# A release run gets its own group, so a push to ps5 can't cancel it half way.
concurrency:
  group: ps5-native-${{ (github.event_name == 'workflow_dispatch' && inputs.release != 'none') && 'release' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release != 'none') }}

jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      BOILERPLATE_REV: 4f531c4b517f80bcb6b1267135848168d2250047
      PS5_OPENGL_REV: 6b6bb2039f741287ed7f1bc6bc4b2c589709a0ba
      PS5_OPENGL_SDK_VERSION: 1.0.2
      SDL_REV: 8c56053f13ca13a0c050de613706ff69eb615836
      # mihawk-99's fork of the payload SDK: its platform layer supplies the
      # C library functions a title lacks or is refused.
      PS5_PLATFORM_REV: e105cf6f25801d9e9981812a89a3b74021d2d2a2
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Every tag, to compare versions and list the commits since the last.
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang-18 cmake curl git libclang-rt-18-dev \
            lld-18 llvm-18 make ninja-build pkg-config python3 tar unzip \
            wget zip

      - name: Choose the version
        # sce_sys/param.json is the committed copy the catalog reads; the
        # build uses the same title ID and content version.
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'none' }}
        run: |
          echo "TITLE_ID=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["titleId"])')" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python3 sys/ps5/content-version.py current)
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "::error::tag $GITHUB_REF_NAME does not match contentVersion $version in sce_sys/param.json"
              exit 1
            }
            python3 sys/ps5/content-version.py check "$version"
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          elif [[ "$RELEASE" != none ]]; then
            [[ "$GITHUB_REF" == refs/heads/ps5 ]] || {
              echo "::error::release from the ps5 branch, not $GITHUB_REF"
              exit 1
            }
            version=$(python3 sys/ps5/content-version.py bump "$RELEASE")
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
            echo "::notice::releasing contentVersion $version"
          else
            version=$(python3 sys/ps5/content-version.py current)
          fi
          echo "CONTENT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Fetch the native toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch each pinned commit by SHA: the boilerplate's is no longer on
          # a branch (upstream main was rewritten), but GitHub still serves it.
          fetch_rev() {
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          # The boilerplate's setup scripts download quietly (wget -q); retry
          # them, as a dropped download fails with no message.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt failed: $*"
              sleep 10
            done
            return 1
          }
          fetch_rev drakmor/ps5-native-app-boilerplate "$BOILERPLATE_REV" "$HOME/ps5-native-app-boilerplate"
          # The compiler wrapper is committed without its executable bit, and
          # the SDL2 build runs it directly.
          chmod +x "$HOME/ps5-native-app-boilerplate/tooling/prospero-clang18"
          retry bash "$HOME/ps5-native-app-boilerplate/tools/setup-native-dependencies.sh"
          # The boilerplate's pinned PacBrew release: zlib for the saves.
          retry bash "$HOME/ps5-native-app-boilerplate/tools/setup-pacbrew-dependencies.sh" --all

          fetch_rev mihawk-99/PS5_PayloadSDK "$PS5_PLATFORM_REV" "$HOME/ps5-platform-sdk"
          fetch_rev darkxex/ps5-opengl "$PS5_OPENGL_REV" "$HOME/ps5-opengl"

          mkdir -p "$HOME/ps5-opengl-sdk"
          gh release download "v$PS5_OPENGL_SDK_VERSION" --repo darkxex/ps5-opengl \
            --pattern "ps5-opengl-sdk-$PS5_OPENGL_SDK_VERSION.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/ps5-opengl-sdk-$PS5_OPENGL_SDK_VERSION.tar.gz" -C "$HOME/ps5-opengl-sdk"

          fetch_rev ps5-payload-dev/SDL "$SDL_REV" "$RUNNER_TEMP/SDL"

      - name: Build SDL2 for the native title
        working-directory: /home/runner/ps5-opengl
        run: |
          python3 integration/SDL2/build.py native \
            --sdl-source "$RUNNER_TEMP/SDL" \
            --sdk-prefix "$HOME/ps5-opengl-sdk/ps5-opengl-sdk-$PS5_OPENGL_SDK_VERSION/sdk" \
            --out build/sdl-native \
            --payload-sdk "$HOME/ps5-native-app-boilerplate/.deps/native/ps5-payload-sdk" \
            --compiler-wrapper "$HOME/ps5-native-app-boilerplate/tooling/prospero-clang18"

      - name: Build the platform layer
        run: make -C "$HOME/ps5-platform-sdk/platform" -j"$(nproc)"

      - name: Build NetHack's data files and fetch PDCursesMod
        working-directory: sys/ps5
        run: ./setup.sh --native

      - name: Build and package the title
        working-directory: sys/ps5
        run: |
          make -f Makefile.native -j"$(nproc)"
          bash package-native.sh --build
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "build-ps5/app/dist/$TITLE_ID.zip" "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$TITLE_ID.zip" | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TITLE_ID }}-${{ env.CONTENT_VERSION }}
          path: dist/

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        env:
          NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        # The catalog shows these as the app's release notes: what changed
        # first, short headings and bullet lists, no images or links.
        run: |
          previous=$(git tag --list '[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]' --sort=-v:refname \
            | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          {
            if [[ -n "$NOTES" ]]; then
              printf '%s\n' "$NOTES"
            elif [[ -n "$previous" ]]; then
              echo "## Changes since $previous"
              echo
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              echo "## First release"
              echo
              echo "- NetHack 5.0 as a native PS5 title ($TITLE_ID), played with the DualSense."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit and tag the new version
        if: env.RELEASE_TAG != '' && github.ref_type != 'tag'
        # Pushes made with the workflow's token start no other workflow, so
        # this neither rebuilds itself nor replaces the nightly payload.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sce_sys/param.json; then
            git commit -q -m "PS5 native: contentVersion $RELEASE_TAG" -- sce_sys/param.json
          fi
          git tag -a "$RELEASE_TAG" -m "NetHack for PS5 $RELEASE_TAG"
          # Atomic: if ps5 moved during the build, neither the bump nor the
          # tag lands, and nothing is released.
          git push --atomic origin "HEAD:refs/heads/ps5" "refs/tags/$RELEASE_TAG"

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::release $RELEASE_TAG already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "dist/$TITLE_ID.zip" \
            --verify-tag --prerelease \
            --title "NetHack for PS5 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
